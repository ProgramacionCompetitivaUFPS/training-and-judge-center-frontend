sonar.projectKey=training-and-judge-center-frontend
sonar.projectName=Training and Judge Center - Frontend
sonar.sourceEncoding=UTF-8

# Production code only: tests, test infrastructure and development mocks are not analysed
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/mocks/**,src/test/**,src/integration/**
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Same exclusions as coverage.exclude in vitest.config.ts, so both tools measure the same code
sonar.coverage.exclusions=src/main.tsx,src/App.tsx,**/*.d.ts,src/types/**,src/**/index.ts,src/components/features/blockly/toolboxConfig.ts,src/workers/**

# Generated by `npm run test:coverage` (lcov reporter); paths normalised to "/" for the Linux scanner
sonar.javascript.lcov.reportPaths=coverage/lcov.sonar.info
