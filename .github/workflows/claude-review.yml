name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      contains(github.event.comment.body, '/review-claude') &&
      (github.event.issue.pull_request != null || github.event.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check authorized user
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          case "$COMMENTER" in
            "CarlosSalazar84"|"AlexaVJ") echo "Authorized user: $COMMENTER" ;;
            *) echo "Unauthorized user: $COMMENTER"; exit 1 ;;
          esac

      - name: Select Claude token by commenter
        id: select-token
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
          TOKEN_CARLOSSALAZAR84: ${{ secrets.CLAUDE_TOKEN_CARLOSSALAZAR84 }}
          TOKEN_ALEXAVJ: ${{ secrets.CLAUDE_TOKEN_ALEXAVJ }}
        run: |
          case "$COMMENTER" in
            "CarlosSalazar84") echo "token=$TOKEN_CARLOSSALAZAR84" >> $GITHUB_OUTPUT ;;
            "AlexaVJ")         echo "token=$TOKEN_ALEXAVJ"         >> $GITHUB_OUTPUT ;;
          esac

      - name: Run Claude PR Review Toolkit
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ steps.select-token.outputs.token }}
          trigger_phrase: '/review-claude'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'pr-review-toolkit@claude-code-plugins'
          show_full_output: true
          claude_args: >-
            --allowedTools "Skill,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            You are an expert and strict code reviewer for a React + TypeScript frontend project. Your goal is to review PR #${{ github.event.issue.number || github.event.pull_request.number }} in the ${{ github.repository }} repository.

            STRICT EXECUTION RULES (DO NOT IMPROVISE):
            1. Use 'gh pr diff ${{ github.event.issue.number || github.event.pull_request.number }} --repo ${{ github.repository }}' to get the diff.
            2. ONLY review files ending in .ts or .tsx — skip everything else (yml, json, md, css, etc.).
            3. If there are no .ts or .tsx files changed, post a comment saying "No TS/TSX files to review in this PR." and stop.
            4. Limit yourself to analyzing the diff. Only read a full file if you need context for a type, interface, or hook dependency.
            5. Make your comments inline.
            6. Once you have the diff, run:

            /pr-review-toolkit:review-pr all
