name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

# A newer push to the same PR cancels the run it supersedes (less queueing, less CI time)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (0 warnings)
        run: npm run lint

      # Unit, page and integration tests (both vitest projects) with coverage. Fails if any metric
      # drops below the 80 % thresholds in vitest.config.ts.
      - name: Tests (unit + integration) with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Build
        run: npm run build
